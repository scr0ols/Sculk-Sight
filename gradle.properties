# Gradle daemon settings.
# Loom decompiles the whole Minecraft jar during genSources, which is memory hungry.
# The official template ships 1G; 3G keeps a first genSources run from thrashing.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with the Gradle configuration cache.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Shared across every module (common, fabric, neoforge).
minecraft_version=26.2
java_version=25

# Mod properties.
# SemVer 2.0.0 core, with the target Minecraft version as build metadata after the plus sign.
# See c-docs/DECISIONS.md ADR-027. The core tracks changes to the mod; the metadata tracks the
# game, and SemVer defines build metadata as ignored for comparison, so rebuilding this same mod
# for a later game version is 0.0.1+26.3 rather than a new mod version. The minor component is
# the phase number from PLAN.md section 5: phase v0.0 is 0.0.x, phase v0.1 is 0.1.x. Left
# unchanged at v0.0's number here - cutting 0.1.0 is a release act reserved to the phase's exit
# (PLAN.md section 5.1), not a consequence of this session's build restructuring.
version=0.0.1+26.2
group=com.scr0ols
mod_id=sculksight
mod_name=Sculk Sight

# Fabric.
# Source of truth: the official fabric-example-mod template, branch 26.2, cross-checked against
# https://fabricmc.net/develop. Checked 2026-08-30. Do not edit these from memory - re-check the
# sources above. loom_version is pinned to a released build (see c-docs/DECISIONS.md ADR-012)
# rather than the template's 1.17-SNAPSHOT, so two checkouts of the same commit resolve the same
# plugin.
loader_version=0.19.3
loom_version=1.17.20
fabric_api_version=0.158.0+26.2

# NeoForge.
# Source of truth: the official MDK-26.2-ModDevGradle template and the neoform maven-metadata.xml
# at maven.neoforged.net, both read 2026-09-04. Do not edit these from memory: Minecraft 26.2
# postdates every assistant's training data, and PLAN.md section 6's "never guess a Minecraft
# internal" rule extends to toolchain versions for the same reason CONVENTIONS.md section 6 gives.
# neo_version must agree with minecraft_version to produce a valid artifact (the loader neoforge/
# runs against). neo_form_version is common/'s own dependency - see its build.gradle - and is
# independent of neo_version: it names a NeoForm build (a Mojang-mapped, loader-free Minecraft
# recompile) rather than a NeoForge release, and the two version families do not have to match
# build-for-build, only Minecraft version.
neoforge_moddev_version=2.0.146
neo_version=26.2.0.75
neo_form_version=26.2-2
minecraft_version_range=[26.2,26.3)

# Test-only dependency, shared by every module that has tests. Latest stable org.junit:junit-bom
# as listed by the Maven Central browse API on 2026-08-31, checked rather than recalled. Test
# scope only: it is not on the runtime classpath and is not packaged into any jar, so
# DECISIONS.md ADR-010's GPL compatibility check for new dependencies does not apply to it.
junit_version=6.1.3
