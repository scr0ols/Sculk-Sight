plugins {
	id 'java-library'
	id 'net.neoforged.moddev'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
	}
}

neoForge {
	neoFormVersion = project.neo_form_version
}

configurations {
	testCompileOnly.extendsFrom(modDevCompileDependencies)
	testRuntimeOnly.extendsFrom(modDevRuntimeDependencies)
}

dependencies {
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test', Test) {
	useJUnitPlatform()

	inputs.dir(file('src/client/java'))
			.withPropertyName('clientSourcesReadByTests')
			.withPathSensitivity(PathSensitivity.RELATIVE)

	testLogging {
		events "passed", "skipped", "failed"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}

	commonClientJava {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile

	commonClientJava file('src/client/java')
}
