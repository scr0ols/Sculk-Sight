pluginManagement {
	repositories {
		gradlePluginPortal()

		// Only Fabric Loom's own plugin needs a non-default repository; ModDevGradle and the
		// foojay resolver both publish to the plugin portal.
		exclusiveContent {
			forRepository {
				maven {
					name = 'Fabric'
					url = uri('https://maven.fabricmc.net')
				}
			}
			filter {
				includeGroupAndSubgroups('net.fabricmc')
			}
		}
	}
}

plugins {
	// Lets Gradle locate a JDK 25 toolchain automatically on any machine, regardless of what is
	// on PATH or in JAVA_HOME. See c-docs/DECISIONS.md ADR-013's addendum on this restructuring.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Matches the folder name so IDEA does not complain (https://youtrack.jetbrains.com/issue/IDEA-317606).
rootProject.name = 'Sculk-Sight'

include('common')
include('fabric')
include('neoforge')
