pluginManagement {
	repositories {
		gradlePluginPortal()

		exclusiveContent {
			forRepository {
				maven {
					name = 'Fabric'
					url = uri('https://maven.fabricmc.net')
				}
			}
			filter {
				includeGroupAndSubgroups('net.fabricmc')
			}
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// https://youtrack.jetbrains.com/issue/IDEA-317606
rootProject.name = 'Sculk-Sight'

include('common')
include('fabric')
include('neoforge')
