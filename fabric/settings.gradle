pluginManagement {
	repositories {
		// Loom itself is published to Fabric's own maven, not to the Gradle Plugin Portal,
		// so this repository has to be declared before the plugin can be resolved.
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Matches the mod id. This is the name of the built jar and of the IDE module.
rootProject.name = 'sculksight'
