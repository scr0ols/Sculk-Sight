# Gradle daemon settings.
# Loom decompiles the whole Minecraft jar during genSources, which is memory hungry.
# The official template ships 1G; 3G keeps a first genSources run from thrashing.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with the Gradle configuration cache.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Toolchain versions.
# Source of truth: the official fabric-example-mod template, branch 26.2, which is
# that repository's default branch, cross-checked against https://fabricmc.net/develop.
# Checked 2026-08-30. Do not edit these from memory - re-check the sources above.
minecraft_version=26.2
loader_version=0.19.3
# The template ships loom_version=1.17-SNAPSHOT. Pinned here to a released build so that
# two checkouts of the same commit resolve the same plugin. See c-docs/DECISIONS.md ADR-012.
loom_version=1.17.20

# Mod properties.
# Phase v0.0 per PLAN.md section 5. Stays 0.0.x until the v0.0 exit criteria are met.
version=0.0.1
group=com.scr0ols

# Dependencies.
# Latest Fabric API build for 26.2 as listed by the Modrinth API on 2026-08-30.
fabric_api_version=0.158.0+26.2

# Test-only dependency. Latest stable org.junit:junit-bom as listed by the Maven Central
# browse API on 2026-08-31, checked rather than recalled. Test scope only: it is not on the
# runtime classpath and is not packaged into the jar, so DECISIONS.md ADR-010's GPL
# compatibility check for new dependencies does not apply to it.
junit_version=6.1.3
