plugins {
	// Fabric Loom is the whole Fabric build toolchain in one plugin. It downloads Minecraft,
	// decompiles it (the genSources task), puts it on the compile classpath, applies mixins
	// at build time, and generates the runClient / runServer launch configurations.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Only for other mods. Loom adds Mojang's and Fabric's own repositories automatically,
	// so Minecraft and Fabric API need nothing declared here.
}

loom {
	// Splits the project into a "main" source set (loaded on client and server) and a
	// "client" source set (client only). Anything touching rendering or the local player
	// must live in src/client, or a dedicated server would crash trying to link it.
	// Sculk Sight is client-side only (DECISIONS.md ADR-006), so almost everything will
	// end up in src/client; the split is kept because it makes that boundary explicit
	// rather than implicit.
	splitEnvironmentSourceSets()

	mods {
		"sculksight" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Versions live in gradle.properties, not here.
	//
	// Note what is absent: there is no `mappings` line. Minecraft 26.1 was the first
	// unobfuscated release, so there is nothing to deobfuscate and Yarn was discontinued
	// after 1.21.11. Class and member names in the decompiled source are Mojang's own.
	// See c-docs/DECISIONS.md ADR-011.
	//
	// `implementation`, not `modImplementation`, and that is correct rather than an
	// oversight - verified 2026-09-01, see c-docs/OPEN-QUESTIONS.md section 14. Older Fabric
	// documentation and older projects declare mod dependencies with `modImplementation`,
	// which existed to remap a mod from Yarn names to obfuscated ones. Minecraft 26.2 is
	// unobfuscated and there are no mappings (ADR-011), so Loom 1.17.20 does not register
	// those configurations at all: writing `modImplementation` here fails outright with
	// "Could not find method modImplementation()". The official fabric-example-mod template
	// for 26.2 uses `implementation` for both lines, exactly as below.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API is technically optional but supplies the event and registry hooks this mod
	// needs: client commands (fabric-command-api-v2, already used by the verification
	// command), key bindings (fabric-key-mapping-api-v1) and the level render events the
	// renderer will hang off (fabric-rendering-v1, LevelRenderEvents).
	//
	// The artifact named here contains no classes of its own - it is a container whose POM
	// lists every submodule as an ordinary Maven dependency, and Gradle resolves those
	// transitively. That is why the compile classpath is complete, and why no jar ever
	// appears in .gradle/loom-cache/remapped_mods: nothing is being remapped.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JUnit, test scope only. The solver and the verification harness are the two things
	// under test; neither names a Minecraft class, so these run as plain JVM tests with no
	// game classes loaded.
	//
	// The BOM (bill of materials) is imported with platform(...) so that the individual
	// JUnit artifacts below carry no version of their own and cannot drift apart from each
	// other. Only the BOM version is written down, in gradle.properties.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"

	// The launcher is what discovers and runs the tests. It is runtime-only because no test
	// source file refers to it by name.
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test', Test) {
	// Gradle still defaults to JUnit 4's runner, and without this line it finds zero tests
	// and reports success - the most dangerous possible failure mode for a test setup.
	useJUnitPlatform()

	testLogging {
		// List individual test results rather than only a summary. The tests in this project
		// carry their argument in their names, so seeing them enumerated is worth the noise.
		events "passed", "skipped", "failed"
	}
}

processResources {
	// Substitutes ${version} inside fabric.mod.json with the version from gradle.properties,
	// so the version number is written in exactly one place.
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 26.2 is compiled for Java 25 and will not load classes built for a newer
	// release, nor link against a project built for an older one.
	it.options.release = 25
}

java {
	// Makes Gradle locate and use a JDK 25 regardless of which JDK is on PATH or in
	// JAVA_HOME. Without this, a machine defaulting to an older JDK fails at compile time
	// with a confusing "invalid source release" error.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom attaches sourcesJar to a RemapSourcesJar task and to `build` when it is present.
	// Removing this line means no sources jar is produced.
	withSourcesJar()
}

jar {
	// The GPL requires the licence text to travel with the distributed work, so the
	// LICENSE file is packaged into the jar. It lives at the repository root rather than
	// in this module, because it covers the whole project and not just the Fabric side.
	def projectName = project.name
	inputs.property "projectName", projectName

	from(rootProject.file("../LICENSE")) {
		rename { "LICENSE_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Publishing targets go here, not dependency repositories. Nothing is published yet.
	}
}
